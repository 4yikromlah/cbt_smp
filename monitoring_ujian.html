<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Ujian | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .nav-bar { margin-bottom: 1.5rem; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; background: #eef0f5; color: #4a3570; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; }
        .info-cards { display: grid; grid-template-columns: repeat(2,1fr); gap: 24px; margin-bottom: 2rem; max-width: 500px; }
        .info-card { background: #eef0f5; border-radius: 28px; padding: 1.5rem; text-align: center; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .badge-progress { background: #f59e0b; color: white; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .token-code { background: #2d2a4a; color: #eef0f5; padding: 4px 10px; border-radius: 40px; font-family: monospace; font-size: 0.8rem; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
    </div>
    <div class="page-title"><h1>Monitoring Ujian CBT</h1></div>
    <div class="info-cards" id="infoCards"></div>
    <div class="table-card">
        <table id="tabelMonitoring">
            <thead><tr><th>No</th><th>Nama Ujian</th><th>Mapel</th><th>Mulai</th><th>Akhir</th><th>Durasi</th><th>Token</th><th>Status</th><th>Selesai</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<script>
    function render() {
        const ujianAktif = getUjian().filter(u => u.status === 'aktif');
        const sesi = getData('sesi_ujian');
        const tokenList = getData('token_ujian');
        const siswaList = getSiswa();
        const tbody = document.querySelector('#tabelMonitoring tbody');
        tbody.innerHTML = '';
        ujianAktif.forEach((u, i) => {
            const token = tokenList.find(t => t.id_ujian === u.id && t.is_active);
            const sesiAktif = sesi.filter(s => s.id_ujian === u.id && s.status === 'active');
            const selesai = sesi.filter(s => s.id_ujian === u.id && s.status === 'finished').length;
            const totalSiswa = siswaList.filter(s => true).length; // asumsi semua siswa ikut ujian aktif
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${u.nama_ujian}</strong></td>
                <td>${getNamaMapelById(u.id_mapel)}</td>
                <td>${u.tanggal_mulai.replace('T',' ')}</td>
                <td>${u.tanggal_akhir.replace('T',' ')}</td>
                <td>${u.durasi_menit} menit</td>
                <td><span class="token-code">${token ? token.token : '-'}</span></td>
                <td><span class="badge-progress">Sedang Berlangsung</span></td>
                <td>${selesai} / ${totalSiswa} siswa</td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('infoCards').innerHTML = `
            <div class="info-card"><div class="info-value">${ujianAktif.length}</div><div class="info-label">UJIAN AKTIF</div></div>
            <div class="info-card"><div class="info-value">${getData('sesi_ujian').filter(s => s.status === 'active').length}</div><div class="info-label">SESI AKTIF</div></div>
        `;
    }
    render();
</script>
</body>
</html>
