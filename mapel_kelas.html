<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapel & Kelas | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .nav-bar { margin-bottom: 1.5rem; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; background: #eef0f5; color: #4a3570; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; }
        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 2rem; }
        .form-card, .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; box-shadow: 15px 15px 30px rgba(0,0,0,0.1), -10px -10px 20px rgba(255,255,245,0.7); }
        .form-group input { width: 100%; padding: 10px; margin: 8px 0; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 3px 3px 6px #bebebe, inset -2px -2px 4px #ffffff; outline: none; }
        .btn-submit { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 10px; border-radius: 60px; font-weight: bold; cursor: pointer; width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .btn-delete { background: #eef0f5; padding: 5px 12px; border-radius: 40px; color: #ef4444; border: none; cursor: pointer; box-shadow: 4px 4px 8px #bebebe, -2px -2px 4px #ffffff; }
        @media (max-width: 860px) { .two-columns { grid-template-columns: 1fr; } }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
    </div>
    <div class="page-title"><h1>Mata Pelajaran & Kelas</h1></div>
    <div class="two-columns">
        <div class="form-card">
            <h3>Tambah Mata Pelajaran</h3>
            <div class="form-group"><input type="text" id="nama_mapel" placeholder="Nama Mata Pelajaran"></div>
            <button class="btn-submit" onclick="tambahMapel()">Simpan Mapel</button>
        </div>
        <div class="form-card">
            <h3>Tambah Kelas</h3>
            <div class="form-group"><input type="text" id="nama_kelas" placeholder="Nama Kelas (contoh: 9A)"></div>
            <button class="btn-submit" onclick="tambahKelas()">Simpan Kelas</button>
        </div>
    </div>
    <div class="two-columns">
        <div class="table-card">
            <h3>Daftar Mata Pelajaran</h3>
            <table id="tabelMapel"><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Aksi</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="table-card">
            <h3>Daftar Kelas</h3>
            <table id="tabelKelas"><thead><tr><th>No</th><th>Kelas</th><th>Aksi</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>
<script>
    function renderMapel() {
        const mapel = getMapel();
        const tbody = document.querySelector('#tabelMapel tbody');
        tbody.innerHTML = '';
        mapel.forEach((m, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${i+1}</td><td>${m.nama_mapel}</td><td><button class="btn-delete" onclick="hapusMapel(${m.id})">Hapus</button></td>`;
            tbody.appendChild(tr);
        });
    }
    function renderKelas() {
        const kelas = getKelas();
        const tbody = document.querySelector('#tabelKelas tbody');
        tbody.innerHTML = '';
        kelas.forEach((k, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${i+1}</td><td>${k.nama_kelas}</td><td><button class="btn-delete" onclick="hapusKelas(${k.id})">Hapus</button></td>`;
            tbody.appendChild(tr);
        });
    }
    function tambahMapel() {
        const nama = document.getElementById('nama_mapel').value;
        if(nama) { addMapel(nama); renderMapel(); document.getElementById('nama_mapel').value = ''; }
        else alert('Isi nama mapel');
    }
    function hapusMapel(id) {
        if(confirm('Yakin hapus mapel ini?')) { deleteMapel(id); renderMapel(); }
    }
    function tambahKelas() {
        const nama = document.getElementById('nama_kelas').value;
        if(nama) { addKelas(nama); renderKelas(); document.getElementById('nama_kelas').value = ''; }
        else alert('Isi nama kelas');
    }
    function hapusKelas(id) {
        if(confirm('Yakin hapus kelas ini?')) { deleteKelas(id); renderKelas(); }
    }
    renderMapel();
    renderKelas();
</script>
</body>
</html>
