<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Ujian | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .nav-bar { margin-bottom: 1.5rem; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; background: #eef0f5; color: #4a3570; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; }
        .filter-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; margin-bottom: 2rem; }
        .filter-form { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 150px; }
        .filter-group select { width: 100%; padding: 10px; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; }
        .btn-filter, .btn-reset { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; }
        .btn-reset { background: #eef0f5; color: #4a3570; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .badge { background: #eef0f5; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .nilai-bagus { background: #10b981; color: white; }
        .nilai-sedang { background: #f59e0b; color: white; }
        .nilai-kurang { background: #ef4444; color: white; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
    </div>
    <div class="page-title"><h1>Hasil Ujian</h1></div>
    <div class="filter-card">
        <div class="filter-form">
            <div class="filter-group"><label>Filter Ujian</label><select id="filterUjian"><option value="">Semua Ujian</option></select></div>
            <div class="filter-group"><label>Filter Siswa</label><select id="filterSiswa"><option value="">Semua Siswa</option></select></div>
            <div class="filter-group"><button class="btn-filter" onclick="filterData()">Filter</button></div>
            <div class="filter-group"><button class="btn-reset" onclick="resetFilter()">Reset</button></div>
        </div>
    </div>
    <div class="table-card">
        <table id="tabelHasil">
            <thead><tr><th>No</th><th>Siswa</th><th>NIS</th><th>Kelas</th><th>Ujian</th><th>Mapel</th><th>Nilai</th><th>Tanggal</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<script>
    let allData = [];
    function loadData() {
        const nilai = getNilai();
        allData = nilai.map(n => {
            const siswa = getSiswa().find(s => s.id === n.id_siswa);
            const ujian = getUjian().find(u => u.id === n.id_ujian);
            return {
                id: n.id,
                siswa: siswa ? siswa.nama_lengkap : '-',
                nis: siswa ? siswa.nis : '-',
                kelas: siswa ? getNamaKelasById(siswa.id_kelas) : '-',
                ujian: ujian ? ujian.nama_ujian : '-',
                mapel: ujian ? getNamaMapelById(ujian.id_mapel) : '-',
                nilai: n.nilai_total,
                tanggal: n.selesai_pada || '2026-05-20'
            };
        });
        populateFilters();
        renderTable(allData);
    }
    function populateFilters() {
        const ujianSelect = document.getElementById('filterUjian');
        const siswaSelect = document.getElementById('filterSiswa');
        const ujianSet = new Set(allData.map(d => d.ujian));
        const siswaSet = new Set(allData.map(d => d.siswa));
        ujianSelect.innerHTML = '<option value="">Semua Ujian</option>' + Array.from(ujianSet).map(u => `<option value="${u}">${u}</option>`).join('');
        siswaSelect.innerHTML = '<option value="">Semua Siswa</option>' + Array.from(siswaSet).map(s => `<option value="${s}">${s}</option>`).join('');
    }
    function filterData() {
        const ujian = document.getElementById('filterUjian').value;
        const siswa = document.getElementById('filterSiswa').value;
        let filtered = allData;
        if(ujian) filtered = filtered.filter(d => d.ujian === ujian);
        if(siswa) filtered = filtered.filter(d => d.siswa === siswa);
        renderTable(filtered);
    }
    function resetFilter() {
        document.getElementById('filterUjian').value = '';
        document.getElementById('filterSiswa').value = '';
        renderTable(allData);
    }
    function renderTable(data) {
        const tbody = document.querySelector('#tabelHasil tbody');
        tbody.innerHTML = '';
        data.forEach((d, i) => {
            let kelasNilai = '';
            if(d.nilai >= 85) kelasNilai = 'nilai-bagus';
            else if(d.nilai >= 70) kelasNilai = 'nilai-sedang';
            else kelasNilai = 'nilai-kurang';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${d.siswa}</strong></td>
                <td>${d.nis}</td>
                <td><span class="badge">${d.kelas}</span></td>
                <td>${d.ujian}</td>
                <td>${d.mapel}</td>
                <td><span class="badge ${kelasNilai}">${d.nilai}</span></td>
                <td>${d.tanggal}</td>
            `;
            tbody.appendChild(tr);
        });
    }
    loadData();
</script>
</body>
</html>
