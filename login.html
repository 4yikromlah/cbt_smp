<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #eef0f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #eef0f5; border-radius: 48px; padding: 2.5rem; width: 380px; box-shadow: 20px 20px 40px #bebebe, -10px -10px 20px #ffffff; text-align: center; }
        .login-card h1 { color: #3c2e5a; margin-bottom: 1rem; }
        .form-group input { width: 100%; padding: 14px; margin: 10px 0; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 4px 4px 8px #bebebe, inset -3px -3px 6px #ffffff; outline: none; }
        .btn-login { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 12px; border-radius: 60px; width: 100%; font-weight: bold; cursor: pointer; }
        .error { color: #ef4444; margin-top: 10px; font-size: 0.8rem; }
        .demo-info { margin-top: 1rem; font-size: 0.7rem; color: #7d6b9e; }
        a { color: #7d64a8; text-decoration: none; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="login-card">
    <h1><i class="fas fa-user-shield"></i> Login Admin</h1>
    <form id="loginForm">
        <div class="form-group"><input type="text" id="username" placeholder="Username" required></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password" required></div>
        <button type="submit" class="btn-login">Login</button>
        <div id="errorMsg" class="error"></div>
    </form>
    <div class="demo-info">Demo: admin / admin123</div>
    <div style="margin-top: 1rem;"><a href="login_guru.html">Login sebagai Guru →</a></div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if(loginAdmin(username, password)) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('errorMsg').innerText = 'Username atau password salah!';
        }
    });
</script>
</body>
</html>
