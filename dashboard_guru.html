<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 28px; margin-bottom: 48px; }
        .stat-card { background: #eef0f5; border-radius: 32px; padding: 1.5rem; text-align: center; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; position: relative; }
        .stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color); border-radius: 32px 0 0 32px; }
        .stat-card:nth-child(1) { --color: #3b82f6; } .stat-card:nth-child(2) { --color: #10b981; } .stat-card:nth-child(3) { --color: #f59e0b; }
        .stat-title { font-size: 0.85rem; font-weight: 600; color: #5a4a7a; margin-bottom: 8px; }
        .stat-number { font-size: 2rem; font-weight: 800; color: #2d2a4a; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .badge-aktif { background: #10b981; color: white; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; display: inline-block; }
        .badge-nonaktif { background: #ef4444; color: white; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; display: inline-block; }
        .token-code { background: #2d2a4a; color: #eef0f5; padding: 4px 10px; border-radius: 40px; font-family: monospace; font-size: 0.8rem; }
        .btn-detail { background: #eef0f5; padding: 5px 12px; border-radius: 40px; text-decoration: none; color: #4a3570; font-size: 0.7rem; box-shadow: 4px 4px 8px #bebebe, -2px -2px 4px #ffffff; display: inline-flex; align-items: center; gap: 5px; }
        @media (max-width: 860px) { .stats-grid { grid-template-columns: 1fr; } .top-header { flex-direction: column; text-align: center; } .admin-area { justify-content: center; } }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area">
            <div class="admin-info" style="display: flex; align-items: center; gap: 12px; background: #eef0f5; padding: 6px 18px; border-radius: 50px; box-shadow: inset 1px 1px 3px #bebebe, inset -2px -2px 5px #ffffff;">
                <i class="fas fa-chalkboard-user"></i>
                <div><span class="admin-role" style="font-size:0.7rem;">Guru</span><span class="admin-name" id="guruName" style="font-weight:700;"></span></div>
            </div>
            <a href="logout_guru.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Keluar</a>
        </div>
    </div>
    <div class="dashboard-title"><h1>Dashboard Guru</h1><p id="guruInfo"></p></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="table-card">
        <h3>Ujian yang Diawasi</h3>
        <table id="tabelUjian">
            <thead><tr><th>No</th><th>Nama Ujian</th><th>Mapel</th><th>Waktu Mulai</th><th>Waktu Akhir</th><th>Durasi</th><th>Token</th><th>Status</th><th>Peserta Selesai</th><th>Aksi</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<script>
    function checkLogin() {
        const user = getCurrentUser();
        if(user.role !== 'guru') {
            window.location.href = 'login_guru.html';
        }
        return user;
    }
    function render() {
        const user = checkLogin();
        const guruId = user.id;
        const guruData = getGuru().find(g => g.id === guruId);
        if(guruData) {
            document.getElementById('guruName').innerText = guruData.nama_lengkap;
            document.getElementById('guruInfo').innerHTML = `Selamat datang, ${guruData.nama_lengkap} (NIP: ${guruData.nip})`;
        }
        // Ambil ujian yang diawasi guru ini
        const pengawasList = getPengawas().filter(p => p.id_guru === guruId);
        const ujianList = pengawasList.map(p => getUjian().find(u => u.id === p.id_ujian)).filter(u => u);
        const tokenList = getData('token_ujian');
        const sesiList = getData('sesi_ujian');
        const siswaList = getSiswa();
        const nilaiList = getNilai();
        
        // Statistik
        const ujianDiawasi = ujianList.length;
        const semuaNilai = nilaiList.filter(n => ujianList.some(u => u.id === n.id_ujian));
        const siswaSelesai = new Set(semuaNilai.map(n => n.id_siswa)).size;
        const ujianAktif = ujianList.filter(u => u.status === 'aktif').length;
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-title">UJIAN DIAWASI</div><div class="stat-number">${ujianDiawasi}</div></div>
            <div class="stat-card"><div class="stat-title">SISWA SELESAI</div><div class="stat-number">${siswaSelesai}</div></div>
            <div class="stat-card"><div class="stat-title">UJIAN AKTIF</div><div class="stat-number">${ujianAktif}</div></div>
        `;
        
        const tbody = document.querySelector('#tabelUjian tbody');
        tbody.innerHTML = '';
        ujianList.forEach((u, i) => {
            const token = tokenList.find(t => t.id_ujian === u.id && t.is_active);
            const selesaiCount = nilaiList.filter(n => n.id_ujian === u.id).length;
            const totalSiswa = siswaList.length; // asumsi semua siswa bisa ikut
            const statusClass = u.status === 'aktif' ? 'badge-aktif' : 'badge-nonaktif';
            const statusText = u.status === 'aktif' ? 'AKTIF' : 'NONAKTIF';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${u.nama_ujian}</strong></td>
                <td>${getNamaMapelById(u.id_mapel)}</td>
                <td>${u.tanggal_mulai.replace('T',' ')}</td>
                <td>${u.tanggal_akhir.replace('T',' ')}</td>
                <td>${u.durasi_menit} menit</td>
                <td><span class="token-code">${token ? token.token : '-'}</span></td>
                <td><span class="${statusClass}">${statusText}</span></td>
                <td>${selesaiCount} / ${totalSiswa}</td>
                <td><a href="guru_detail_ujian.html?id=${u.id}" class="btn-detail"><i class="fas fa-chart-line"></i> Detail</a></td>
            `;
            tbody.appendChild(tr);
        });
        if(ujianList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center">Belum ada ujian yang ditugaskan kepada Anda.</td></tr>';
        }
    }
    render();
</script>
</body>
</html>
