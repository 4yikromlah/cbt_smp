<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Ujian | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
        .btn-back, .btn-tambah { display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; background: #eef0f5; color: #4a3570; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; }
        .btn-tambah { background: linear-gradient(145deg, #10b981, #059669); color: white; }
        .info-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-bottom: 2rem; }
        .info-card { background: #eef0f5; border-radius: 28px; padding: 1.5rem; text-align: center; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .info-card .info-value { font-size: 1.8rem; font-weight: 800; color: #2d2a4a; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .badge-aktif { background: #10b981; color: white; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .badge-nonaktif { background: #ef4444; color: white; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .btn-action { background: #eef0f5; padding: 5px 10px; border-radius: 40px; font-size: 0.7rem; text-decoration: none; color: #4a3570; display: inline-flex; align-items: center; gap: 5px; box-shadow: 4px 4px 8px #bebebe, -2px -2px 4px #ffffff; margin-right: 5px; cursor: pointer; border: none; }
        .btn-delete { background: #eef0f5; padding: 5px 10px; border-radius: 40px; color: #ef4444; border: none; cursor: pointer; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #eef0f5; border-radius: 48px; padding: 2rem; width: 90%; max-width: 500px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; margin: 8px 0; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 3px 3px 6px #bebebe, inset -2px -2px 4px #ffffff; outline: none; }
        .form-row { display: flex; gap: 10px; }
        .btn-submit { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 10px; border-radius: 60px; width: 100%; font-weight: bold; cursor: pointer; }
        .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
        <button class="btn-tambah" onclick="openTambahModal()">+ Tambah Ujian</button>
    </div>
    <div class="page-title"><h1>Kelola Ujian</h1></div>
    <div class="info-cards" id="infoCards"></div>
    <div class="table-card">
        <table id="tabelUjian">
            <thead><tr><th>No</th><th>Nama Ujian</th><th>Mapel</th><th>Mulai</th><th>Akhir</th><th>Durasi</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<div id="modalTambah" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeTambahModal()">&times;</span>
        <h3>Tambah Ujian Baru</h3>
        <div class="form-group"><input type="text" id="nama_ujian" placeholder="Nama Ujian"></div>
        <div class="form-group"><select id="id_mapel"><option value="">Pilih Mata Pelajaran</option></select></div>
        <div class="form-row"><div class="form-group"><input type="datetime-local" id="tanggal_mulai"></div><div class="form-group"><input type="number" id="durasi" placeholder="Durasi (menit)"></div></div>
        <div class="form-group"><input type="datetime-local" id="tanggal_akhir"></div>
        <div class="form-group"><select id="status"><option value="nonaktif">Nonaktif</option><option value="aktif">Aktif</option></select></div>
        <button class="btn-submit" onclick="tambahUjian()">Simpan</button>
    </div>
</div>
<div id="modalEdit" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeEditModal()">&times;</span>
        <h3>Edit Ujian</h3>
        <input type="hidden" id="edit_id">
        <div class="form-group"><input type="text" id="edit_nama" placeholder="Nama Ujian"></div>
        <div class="form-group"><select id="edit_mapel"></select></div>
        <div class="form-row"><div class="form-group"><input type="datetime-local" id="edit_tanggal_mulai"></div><div class="form-group"><input type="number" id="edit_durasi" placeholder="Durasi"></div></div>
        <div class="form-group"><input type="datetime-local" id="edit_tanggal_akhir"></div>
        <div class="form-group"><select id="edit_status"><option value="nonaktif">Nonaktif</option><option value="aktif">Aktif</option></select></div>
        <button class="btn-submit" onclick="updateUjianHandler()">Update</button>
    </div>
</div>
<script>
    function loadMapelOptions(selectId) {
        const mapel = getMapel();
        const select = document.getElementById(selectId);
        select.innerHTML = '<option value="">Pilih Mata Pelajaran</option>' + mapel.map(m => `<option value="${m.id}">${m.nama_mapel}</option>`).join('');
    }
    function updateInfo() {
        const ujian = getUjian();
        const aktif = ujian.filter(u => u.status === 'aktif').length;
        document.getElementById('infoCards').innerHTML = `
            <div class="info-card"><div class="info-value">${ujian.length}</div><div class="info-label">TOTAL UJIAN</div></div>
            <div class="info-card"><div class="info-value">${aktif}</div><div class="info-label">UJIAN AKTIF</div></div>
            <div class="info-card"><div class="info-value">${ujian.length - aktif}</div><div class="info-label">UJIAN NONAKTIF</div></div>
        `;
    }
    function render() {
        const ujian = getUjian();
        const tbody = document.querySelector('#tabelUjian tbody');
        tbody.innerHTML = '';
        ujian.forEach((u, i) => {
            const statusClass = u.status === 'aktif' ? 'badge-aktif' : 'badge-nonaktif';
            const statusText = u.status === 'aktif' ? 'AKTIF' : 'NONAKTIF';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${u.nama_ujian}</strong></td>
                <td>${getNamaMapelById(u.id_mapel)}</td>
                <td>${u.tanggal_mulai.replace('T',' ')}</td>
                <td>${u.tanggal_akhir.replace('T',' ')}</td>
                <td>${u.durasi_menit} menit</td>
                <td><span class="${statusClass}">${statusText}</span></td>
                <td>
                    <button class="btn-action" onclick="gantiStatus(${u.id})">Ganti Status</button>
                    <a href="kelola_soal.html?id=${u.id}" class="btn-action">Kelola Soal</a>
                    <button class="btn-action" onclick="openEditModal(${u.id})">Edit</button>
                    <button class="btn-delete" onclick="hapusUjian(${u.id})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        updateInfo();
    }
    function openTambahModal() { loadMapelOptions('id_mapel'); document.getElementById('modalTambah').classList.add('active'); }
    function closeTambahModal() { document.getElementById('modalTambah').classList.remove('active'); }
    function openEditModal(id) {
        const u = getUjian().find(u => u.id === id);
        if(u) {
            document.getElementById('edit_id').value = u.id;
            document.getElementById('edit_nama').value = u.nama_ujian;
            loadMapelOptions('edit_mapel');
            setTimeout(() => { document.getElementById('edit_mapel').value = u.id_mapel; }, 100);
            document.getElementById('edit_tanggal_mulai').value = u.tanggal_mulai;
            document.getElementById('edit_tanggal_akhir').value = u.tanggal_akhir;
            document.getElementById('edit_durasi').value = u.durasi_menit;
            document.getElementById('edit_status').value = u.status;
            document.getElementById('modalEdit').classList.add('active');
        }
    }
    function closeEditModal() { document.getElementById('modalEdit').classList.remove('active'); }
    function tambahUjian() {
        const nama = document.getElementById('nama_ujian').value;
        const mapel = document.getElementById('id_mapel').value;
        const mulai = document.getElementById('tanggal_mulai').value;
        const akhir = document.getElementById('tanggal_akhir').value;
        const durasi = document.getElementById('durasi').value;
        const status = document.getElementById('status').value;
        if(nama && mapel && mulai && akhir && durasi) {
            addUjian(nama, parseInt(mapel), mulai, akhir, durasi, status);
            closeTambahModal();
            render();
        } else alert('Isi semua field!');
    }
    function updateUjianHandler() {
        const id = parseInt(document.getElementById('edit_id').value);
        const nama = document.getElementById('edit_nama').value;
        const mapel = document.getElementById('edit_mapel').value;
        const mulai = document.getElementById('edit_tanggal_mulai').value;
        const akhir = document.getElementById('edit_tanggal_akhir').value;
        const durasi = document.getElementById('edit_durasi').value;
        const status = document.getElementById('edit_status').value;
        if(nama && mapel && mulai && akhir && durasi) {
            updateUjian(id, { nama_ujian: nama, id_mapel: parseInt(mapel), tanggal_mulai: mulai, tanggal_akhir: akhir, durasi_menit: parseInt(durasi), status });
            closeEditModal();
            render();
        } else alert('Isi semua field!');
    }
    function gantiStatus(id) {
        const u = getUjian().find(u => u.id === id);
        if(u) {
            const newStatus = u.status === 'aktif' ? 'nonaktif' : 'aktif';
            updateUjian(id, { status: newStatus });
            render();
        }
    }
    function hapusUjian(id) {
        if(confirm('Yakin hapus ujian? Semua soal dan nilai akan hilang!')) {
            deleteUjian(id);
            render();
        }
    }
    render();
</script>
</body>
</html>
