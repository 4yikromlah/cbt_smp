<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Nilai Excel | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #eef0f5; border-radius: 48px; padding: 2rem; width: 90%; max-width: 800px; text-align: center; box-shadow: 20px 20px 40px #bebebe, -10px -10px 20px #ffffff; }
        table { width: 100%; margin: 1rem 0; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .btn { background: linear-gradient(145deg, #10b981, #059669); color: white; border: none; padding: 10px 28px; border-radius: 60px; cursor: pointer; margin-top: 1rem; }
        .back-link { display: inline-block; margin-top: 1rem; color: #7d64a8; text-decoration: none; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="card">
    <h2><i class="fas fa-file-excel"></i> Export Nilai ke Excel</h2>
    <p>Data nilai ujian (gabungan dari semua ujian)</p>
    <table id="nilaiTable">
        <thead><tr><th>No</th><th>Siswa</th><th>NIS</th><th>Kelas</th><th>Mata Pelajaran</th><th>Ujian</th><th>Nilai</th><th>Tanggal</th></tr></thead>
        <tbody></tbody>
    </table>
    <button class="btn" onclick="exportToExcel()"><i class="fas fa-download"></i> Download Excel</button>
    <br><a href="index.html" class="back-link">← Kembali ke Dashboard</a>
</div>
<script>
    function loadData() {
        const nilai = getNilai();
        const tbody = document.querySelector('#nilaiTable tbody');
        tbody.innerHTML = '';
        nilai.forEach((n, i) => {
            const siswa = getSiswa().find(s => s.id === n.id_siswa);
            const ujian = getUjian().find(u => u.id === n.id_ujian);
            if(siswa && ujian) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i+1}</td>
                    <td>${siswa.nama_lengkap}</td>
                    <td>${siswa.nis}</td>
                    <td>${getNamaKelasById(siswa.id_kelas)}</td>
                    <td>${getNamaMapelById(ujian.id_mapel)}</td>
                    <td>${ujian.nama_ujian}</td>
                    <td>${n.nilai_total}</td>
                    <td>${n.selesai_pada || '-'}</td>
                `;
                tbody.appendChild(tr);
            }
        });
    }
    function exportToExcel() {
        let html = document.getElementById('nilaiTable').outerHTML;
        let blob = new Blob([html], {type: 'application/vnd.ms-excel'});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'rekap_nilai.xls';
        link.click();
    }
    loadData();
</script>
</body>
</html>
