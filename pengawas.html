<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengawas | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .logo-area .brand { display: flex; align-items: center; gap: 12px; }
        .cbt-logo { font-size: 2.2rem; background: linear-gradient(145deg, #7c5e9a, #4a3b6e); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .brand h2 { font-size: 1.4rem; font-weight: 700; color: #3c2e5a; }
        .brand p { font-size: 0.7rem; font-weight: 500; color: #7d6b9e; }
        .admin-area { display: flex; align-items: center; gap: 20px; }
        .logout-btn { background: linear-gradient(145deg, #e2e6ec, #f0f4fa); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: #5a3a7a; box-shadow: 8px 8px 16px #bebebe, -4px -4px 8px #ffffff; }
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
        .btn-back, .btn-tambah { display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none; font-weight: 600; background: #eef0f5; color: #4a3570; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; }
        .btn-tambah { background: linear-gradient(145deg, #10b981, #059669); color: white; }
        .btn-delete { background: #eef0f5; padding: 5px 12px; border-radius: 40px; color: #ef4444; border: none; cursor: pointer; box-shadow: 4px 4px 8px #bebebe, -2px -2px 4px #ffffff; }
        .info-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-bottom: 2rem; }
        .info-card { background: #eef0f5; border-radius: 28px; padding: 1.5rem; text-align: center; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .info-card .info-value { font-size: 1.8rem; font-weight: 800; color: #2d2a4a; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .badge { background: #eef0f5; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #eef0f5; border-radius: 48px; padding: 2rem; width: 90%; max-width: 500px; }
        .form-group select { width: 100%; padding: 10px; margin: 8px 0; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 3px 3px 6px #bebebe, inset -2px -2px 4px #ffffff; outline: none; }
        .btn-submit { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 10px; border-radius: 60px; width: 100%; font-weight: bold; cursor: pointer; }
        .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
        <button class="btn-tambah" onclick="openModal()">+ Tugas Pengawas</button>
    </div>
    <div class="page-title"><h1>Kelola Pengawas</h1></div>
    <div class="info-cards" id="infoCards"></div>
    <div class="table-card">
        <table id="tabelPengawas">
            <thead><tr><th>No</th><th>Guru</th><th>NIP</th><th>Ujian</th><th>Ditugaskan</th><th>Aksi</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<div id="modalPengawas" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3>Tugaskan Pengawas</h3>
        <div class="form-group"><select id="id_guru"><option value="">Pilih Guru</option></select></div>
        <div class="form-group"><select id="id_ujian"><option value="">Pilih Ujian</option></select></div>
        <button class="btn-submit" onclick="tambahPengawas()">Tugaskan</button>
    </div>
</div>
<script>
    function loadOptions() {
        const guruSelect = document.getElementById('id_guru');
        const ujianSelect = document.getElementById('id_ujian');
        const gurus = getGuru();
        const ujians = getUjian();
        guruSelect.innerHTML = '<option value="">Pilih Guru</option>' + gurus.map(g => `<option value="${g.id}">${g.nama_lengkap} (${g.nip})</option>`).join('');
        ujianSelect.innerHTML = '<option value="">Pilih Ujian</option>' + ujians.map(u => `<option value="${u.id}">${u.nama_ujian}</option>`).join('');
    }
    function updateInfo() {
        const pengawas = getPengawas();
        document.getElementById('infoCards').innerHTML = `
            <div class="info-card"><div class="info-value">${pengawas.length}</div><div class="info-label">TOTAL PENGAWAS</div></div>
            <div class="info-card"><div class="info-value">${getGuru().length}</div><div class="info-label">GURU TERSEDIA</div></div>
            <div class="info-card"><div class="info-value">${getUjian().length}</div><div class="info-label">UJIAN TERSEDIA</div></div>
        `;
    }
    function render() {
        const pengawas = getPengawas();
        const tbody = document.querySelector('#tabelPengawas tbody');
        tbody.innerHTML = '';
        pengawas.forEach((p, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${getNamaGuruById(p.id_guru)}</strong></td>
                <td>${getNIPById(p.id_guru)}</td>
                <td><span class="badge">${getNamaUjianById(p.id_ujian)}</span></td>
                <td>${p.ditugaskan_pada}</td>
                <td><button class="btn-delete" onclick="hapusPengawas(${p.id})">Hapus</button></td>
            `;
            tbody.appendChild(tr);
        });
        updateInfo();
    }
    function openModal() { loadOptions(); document.getElementById('modalPengawas').classList.add('active'); }
    function closeModal() { document.getElementById('modalPengawas').classList.remove('active'); }
    function tambahPengawas() {
        const id_guru = document.getElementById('id_guru').value;
        const id_ujian = document.getElementById('id_ujian').value;
        if(id_guru && id_ujian) {
            addPengawas(parseInt(id_guru), parseInt(id_ujian));
            closeModal();
            render();
        } else alert('Pilih guru dan ujian');
    }
    function hapusPengawas(id) {
        if(confirm('Batalkan tugas pengawas?')) {
            deletePengawas(id);
            render();
        }
    }
    render();
</script>
</body>
</html>
