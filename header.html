<!-- header.html - Komponen header yang dapat digunakan bersama -->
<div class="top-header">
    <div class="logo-area">
        <div class="brand">
            <span class="cbt-logo">📚</span>
            <div>
                <h2>CBT System</h2>
                <p>SMP MAARIF TEGALAMPEL</p>
            </div>
        </div>
    </div>
    <div class="status-area">
        <div class="online-status">
            <span class="led online"></span>
            <span>ONLINE</span>
        </div>
    </div>
    <div class="admin-area">
        <div class="admin-info">
            <i class="fas fa-user-circle"></i>
            <div>
                <span class="admin-role">Administrator</span>
                <span class="admin-name" id="adminNameDisplay">Administrator Utama</span>
            </div>
        </div>
        <a href="logout.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Keluar</a>
    </div>
</div>
<script>
    // Jika header di-load secara terpisah, pastikan name display diisi
    const user = getCurrentUser();
    if(user.name) {
        const nameSpan = document.getElementById('adminNameDisplay');
        if(nameSpan) nameSpan.innerText = user.name;
    }
</script>
