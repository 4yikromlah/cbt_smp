<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Admin | CBT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef0f5; padding: 0 0 2rem 0; display: flex; justify-content: center; }
        .main-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; margin-top: 4px; }
        .top-header, .nav-bar, .page-title, .table-card, .info-cards, .modal { /* gaya sama seperti sebelumnya, saya singkat agar tidak terlalu panjang. Anda bisa copy dari index.html untuk header dan card */ }
        /* Saya akan gunakan gaya minimal namun tetap neomorfisme */
        .top-header { display: flex; justify-content: space-between; align-items: center; background: #eef0f5; border-radius: 60px; padding: 0.8rem 2rem; margin-bottom: 2rem; box-shadow: 12px 12px 24px #bebebe, -8px -8px 18px #ffffff; }
        .btn-back, .btn-tambah, .btn-delete, .btn-disabled { /* gaya dasar */ display: inline-flex; align-items: center; gap: 8px; padding: 0.5rem 1.2rem; border-radius: 40px; text-decoration: none; font-size: 0.85rem; font-weight: 600; box-shadow: 6px 6px 12px #bebebe, -4px -4px 8px #ffffff; background: #eef0f5; color: #4a3570; }
        .btn-tambah { background: linear-gradient(145deg, #10b981, #059669); color: white; }
        .btn-delete { color: #ef4444; }
        .btn-disabled { color: #9ca3af; cursor: not-allowed; }
        .badge-utama { background: #d4af37; color: #2d2a4a; }
        .table-card { background: rgba(248,244,255,0.65); border-radius: 32px; padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(128,100,162,0.15); }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #eef0f5; border-radius: 48px; padding: 2rem; width: 90%; max-width: 500px; }
        .form-group input { width: 100%; padding: 12px; margin: 8px 0; border: none; background: #eef0f5; border-radius: 60px; box-shadow: inset 3px 3px 6px #bebebe, inset -2px -2px 4px #ffffff; outline: none; }
        .btn-submit { background: linear-gradient(145deg, #7d64a8, #5a3e7c); color: white; border: none; padding: 10px; border-radius: 60px; width: 100%; font-weight: bold; cursor: pointer; }
        .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    </style>
    <script src="cbt.js"></script>
</head>
<body>
<div class="main-wrapper">
    <div class="top-header">
        <div class="logo-area"><div class="brand"><span class="cbt-logo">📚</span><div><h2>CBT System</h2><p>SMP MAARIF TEGALAMPEL</p></div></div></div>
        <div class="admin-area"><a href="logout.html" class="logout-btn">Keluar</a></div>
    </div>
    <div class="nav-bar">
        <a href="index.html" class="btn-back">← Kembali</a>
        <button class="btn-tambah" onclick="openModal()">+ Tambah Admin</button>
    </div>
    <div class="page-title"><h1>Kelola Admin</h1></div>
    <div class="table-card">
        <table id="tabelAdmin">
            <thead><tr><th>No</th><th>Username</th><th>Nama</th><th>Status</th><th>Terdaftar</th><th>Aksi</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<div id="modalAdmin" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3>Tambah Admin Baru</h3>
        <div class="form-group"><input type="text" id="username" placeholder="Username"></div>
        <div class="form-group"><input type="text" id="nama" placeholder="Nama Lengkap"></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password"></div>
        <button class="btn-submit" onclick="tambahAdmin()">Simpan</button>
    </div>
</div>
<script>
    function render() {
        const admins = getAdmin();
        const tbody = document.querySelector('#tabelAdmin tbody');
        tbody.innerHTML = '';
        admins.forEach((a, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i+1}</td>
                <td><strong>${a.username}</strong></td>
                <td>${a.nama_lengkap}</td>
                <td>${a.is_utama ? '<span class="badge-utama">Akun Utama</span>' : 'Aktif'}</td>
                <td>${a.created_at}</td>
                <td>${a.is_utama ? '<span class="btn-disabled">Tidak Dapat Dihapus</span>' : `<button class="btn-delete" onclick="hapusAdmin(${a.id})">Hapus</button>`}</td>
            `;
            tbody.appendChild(tr);
        });
    }
    function openModal() { document.getElementById('modalAdmin').classList.add('active'); }
    function closeModal() { document.getElementById('modalAdmin').classList.remove('active'); }
    function tambahAdmin() {
        const username = document.getElementById('username').value;
        const nama = document.getElementById('nama').value;
        const password = document.getElementById('password').value;
        if(username && nama && password) {
            addAdmin(username, password, nama);
            closeModal();
            render();
            document.getElementById('username').value = '';
            document.getElementById('nama').value = '';
            document.getElementById('password').value = '';
        } else alert('Isi semua field!');
    }
    function hapusAdmin(id) {
        if(confirm('Yakin hapus admin ini?')) {
            if(deleteAdmin(id)) render();
            else alert('Admin utama tidak bisa dihapus!');
        }
    }
    render();
</script>
</body>
</html>
